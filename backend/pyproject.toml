[project]
name = "household-app-backend"
version = "0.1.0"
description = "パートナー共用の家計清算アプリ - バックエンド (FastAPI)"
requires-python = ">=3.11"

# Phase 2 で必要な最小限の依存
dependencies = [
    # DB / ORM / マイグレーション
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",   # PostgreSQL ドライバ（バイナリ配布で楽）

    # 設定ファイル読み込み
    "pydantic>=2.9",
    "pydantic-settings>=2.5",  # .env の読み込み

    # ハッシュ化（seed のパスワードで使う）
    "bcrypt>=4.2",

    # Phase 3 追加: バックエンド API + 構造化ログ
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "python-multipart>=0.0.20",  # ファイルアップロード（PayPay CSV）用
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",      # FastAPI の TestClient が内部で使う
    "mypy>=1.11",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# tests/ 以下を探索。-q で出力を簡潔に。
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: DB に接続する統合テスト（コンテナ起動が必要）",
]
