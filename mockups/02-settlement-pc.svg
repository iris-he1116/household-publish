<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="10" y="10" width="980" height="680" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>

  <!-- top bar -->
  <rect x="10" y="10" width="980" height="52" fill="#111827"/>
  <text x="32" y="42" fill="#ffffff" font-size="15" font-weight="600">家計清算</text>
  <text x="176" y="42" fill="#9ca3af" font-size="13">ホーム</text>
  <rect x="246" y="10" width="70" height="52" fill="#1f2937"/>
  <text x="266" y="42" fill="#ffffff" font-size="13" font-weight="600">清算</text>
  <text x="336" y="42" fill="#9ca3af" font-size="13">PayPay 取り込み</text>
  <text x="900" y="42" fill="#d1d5db" font-size="12">ありす ▾</text>

  <!-- month selector + status -->
  <text x="32" y="98" font-size="18" font-weight="700">月次清算</text>
  <rect x="140" y="80" width="126" height="26" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="98" font-size="12">◂ 2026-07 ▸</text>
  <rect x="280" y="80" width="120" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="294" y="98" font-size="11" fill="#92400e">締め済み・要確認</text>
  <text x="952" y="98" font-size="11" fill="#2563eb" text-anchor="end">過去の月を見る ▾</text>

  <!-- ===== summary ===== -->
  <rect x="32" y="120" width="936" height="128" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="52" y="146" font-weight="600" font-size="14">2026年7月の集計</text>
  <text x="180" y="146" font-size="11" fill="#6b7280">7/1 〜 7/31 ・ 15 件</text>

  <text x="52" y="176" fill="#6b7280" font-size="11">共有支出の合計</text>
  <text x="52" y="204" font-size="21" font-weight="700">¥ 52,720</text>

  <text x="260" y="176" fill="#6b7280" font-size="11">1人あたりの負担</text>
  <text x="260" y="204" font-size="21" font-weight="700">¥ 26,360</text>

  <text x="470" y="176" fill="#6b7280" font-size="11">ありすの立替</text>
  <text x="470" y="204" font-size="21" font-weight="700">¥ 32,080</text>

  <text x="680" y="176" fill="#6b7280" font-size="11">ひつじの立替</text>
  <text x="680" y="204" font-size="21" font-weight="700">¥ 20,640</text>

  <rect x="52" y="216" width="896" height="20" rx="4" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="66" y="230" font-size="12" fill="#0e7490">➡ ひつじ → ありす に <tspan font-weight="700">¥ 5,720</tspan> を送金してください</text>

  <!-- ===== confirmation ===== -->
  <rect x="32" y="262" width="936" height="106" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="286" font-weight="600">双方の確認</text>
  <text x="140" y="286" font-size="11" fill="#6b7280">2人とも押すと「清算済」になります</text>

  <rect x="52" y="298" width="440" height="56" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="72" y="322" font-weight="600" font-size="13">ありす</text>
  <text x="72" y="342" font-size="11" fill="#166534">✓ 確認済み（2026-08-01 09:12）</text>

  <rect x="508" y="298" width="440" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="528" y="322" font-weight="600" font-size="13">ひつじ</text>
  <text x="528" y="342" font-size="11" fill="#6b7280">未確認</text>
  <rect x="806" y="312" width="126" height="32" rx="6" fill="#111827"/>
  <text x="869" y="333" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">確認する</text>

  <!-- ===== breakdown ===== -->
  <rect x="32" y="384" width="608" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="408" font-weight="600">カテゴリ別内訳</text>
  <text x="52" y="434" font-size="11">食費</text>
  <rect x="140" y="422" width="290" height="16" fill="#60a5fa"/>
  <text x="620" y="434" font-size="11" text-anchor="end">¥19,360 ・ 6件</text>
  <text x="52" y="458" font-size="11">外食</text>
  <rect x="140" y="446" width="216" height="16" fill="#f87171"/>
  <text x="620" y="458" font-size="11" text-anchor="end">¥14,600 ・ 3件</text>
  <text x="52" y="482" font-size="11">日用品</text>
  <rect x="140" y="470" width="120" height="16" fill="#34d399"/>
  <text x="620" y="482" font-size="11" text-anchor="end">¥8,020 ・ 3件</text>
  <text x="52" y="506" font-size="11">娯楽</text>
  <rect x="140" y="494" width="79" height="16" fill="#fbbf24"/>
  <text x="620" y="506" font-size="11" text-anchor="end">¥5,280 ・ 2件</text>
  <text x="52" y="530" font-size="11">その他</text>
  <rect x="140" y="518" width="33" height="16" fill="#a78bfa"/>
  <text x="620" y="530" font-size="11" text-anchor="end">¥2,200 ・ 1件</text>
  <text x="52" y="560" font-size="11" fill="#2563eb">カテゴリをクリックすると、その明細だけをホームで絞り込みます</text>

  <!-- payment method -->
  <rect x="652" y="384" width="316" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="672" y="408" font-weight="600">支払い手段</text>
  <text x="672" y="434" font-size="12">現金</text><text x="948" y="434" font-size="12" text-anchor="end">¥ 13,220</text>
  <text x="672" y="458" font-size="12">クレジットカード</text><text x="948" y="458" font-size="12" text-anchor="end">¥ 22,280</text>
  <text x="672" y="482" font-size="12">PayPay</text><text x="948" y="482" font-size="12" text-anchor="end">¥ 14,540</text>
  <text x="672" y="506" font-size="12">WeChat Pay</text><text x="948" y="506" font-size="12" text-anchor="end">¥ 2,680</text>
  <line x1="672" y1="520" x2="948" y2="520" stroke="#e5e7eb"/>
  <text x="672" y="542" font-size="12" font-weight="600">合計</text>
  <text x="948" y="542" font-size="12" font-weight="600" text-anchor="end">¥ 52,720</text>
  <text x="672" y="566" font-size="10" fill="#6b7280">端数 1 円は立替の少ない側が負担（DESIGN.md §4）</text>

  <!-- ===== past months ===== -->
  <rect x="32" y="598" width="936" height="76" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="52" y="620" font-weight="600" font-size="13">過去の清算</text>
  <line x1="52" y1="630" x2="948" y2="630" stroke="#e5e7eb"/>
  <text x="52" y="650" font-size="12">2026-06</text>
  <rect x="130" y="638" width="66" height="18" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="163" y="651" font-size="10" fill="#166534" text-anchor="middle">清算済</text>
  <text x="230" y="650" font-size="12">¥ 64,770</text>
  <text x="360" y="650" font-size="12" fill="#6b7280">ひつじ → ありす ¥4,615</text>
  <text x="948" y="650" font-size="11" fill="#2563eb" text-anchor="end">詳細</text>
  <text x="52" y="668" font-size="10" fill="#9ca3af">※ 清算済の月でも支出は編集できる。編集すると「更新あり」バッジが付く（状態は戻さない）</text>
</svg>
