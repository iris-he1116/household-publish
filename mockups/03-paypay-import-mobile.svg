<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="0" y="0" width="390" height="844" rx="28" fill="#ffffff" stroke="#111827" stroke-width="2"/>

  <!-- status bar -->
  <text x="24" y="30" font-size="11" font-weight="600">9:41</text>
  <text x="366" y="30" font-size="11" text-anchor="end">▮▮▮ ⏺</text>

  <!-- header -->
  <rect x="2" y="42" width="386" height="46" fill="#111827"/>
  <text x="20" y="71" fill="#ffffff" font-size="14" font-weight="600">PayPay 取り込み</text>
  <text x="370" y="71" fill="#d1d5db" font-size="11" text-anchor="end">ありす ▾</text>

  <!-- note: CSV は PC 推奨 -->
  <rect x="16" y="100" width="358" height="52" rx="8" fill="#fefce8" stroke="#facc15"/>
  <text x="30" y="120" font-size="11" fill="#713f12">💡 CSV のアップロードは PC からが楽です</text>
  <text x="30" y="140" font-size="10" fill="#713f12">スマホでは「判定だけ」する使い方を想定しています</text>

  <!-- upload (compact) -->
  <rect x="16" y="164" width="358" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 3"/>
  <text x="195" y="192" font-size="12" fill="#374151" text-anchor="middle">📁 CSV を選択してアップロード</text>

  <!-- import result -->
  <rect x="16" y="220" width="358" height="38" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="30" y="238" font-size="10" fill="#0e7490">直近：08-04 09:30 ／ 全 45 行</text>
  <text x="30" y="252" font-size="10" fill="#0e7490">新規 5 行 ・ 重複 40 行（自動で除外）</text>

  <!-- section title -->
  <text x="16" y="284" font-weight="600" font-size="14">未判定の行（4 件）</text>
  <text x="374" y="284" font-size="11" fill="#2563eb" text-anchor="end">すべて選択</text>

  <!-- ===== card 1（チェック済み） ===== -->
  <rect x="16" y="296" width="358" height="94" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="30" y="310" width="18" height="18" rx="4" fill="#111827"/>
  <text x="34" y="324" font-size="13" fill="#ffffff">✓</text>
  <text x="58" y="324" font-size="13" font-weight="600">セブンイレブン 渋谷</text>
  <text x="358" y="324" font-size="14" font-weight="700" text-anchor="end">¥ 1,180</text>
  <text x="58" y="342" font-size="10" fill="#6b7280">2026-08-02</text>

  <rect x="30" y="352" width="180" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="42" y="371" font-size="11">食費 ▾</text>
  <rect x="218" y="352" width="80" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="228" y="371" font-size="10" fill="#9ca3af">メモ</text>
  <text x="358" y="371" font-size="11" fill="#dc2626" text-anchor="end">個人にする</text>

  <!-- ===== card 2（チェック済み） ===== -->
  <rect x="16" y="400" width="358" height="94" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="30" y="414" width="18" height="18" rx="4" fill="#111827"/>
  <text x="34" y="428" font-size="13" fill="#ffffff">✓</text>
  <text x="58" y="428" font-size="13" font-weight="600">Amazon.co.jp</text>
  <text x="358" y="428" font-size="14" font-weight="700" text-anchor="end">¥ 3,480</text>
  <text x="58" y="446" font-size="10" fill="#6b7280">2026-08-03</text>

  <rect x="30" y="456" width="180" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="42" y="475" font-size="11">日用品 ▾</text>
  <rect x="218" y="456" width="80" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="226" y="475" font-size="10">洗剤…</text>
  <text x="358" y="475" font-size="11" fill="#dc2626" text-anchor="end">個人にする</text>

  <!-- ===== card 3（未チェック） ===== -->
  <rect x="16" y="504" width="358" height="94" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="30" y="518" width="18" height="18" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="532" font-size="13" font-weight="600">スターバックス 恵比寿</text>
  <text x="358" y="532" font-size="14" font-weight="700" text-anchor="end">¥ 680</text>
  <text x="58" y="550" font-size="10" fill="#6b7280">2026-08-02</text>

  <rect x="30" y="560" width="180" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="42" y="579" font-size="11" fill="#9ca3af">カテゴリ選択 ▾</text>
  <rect x="218" y="560" width="80" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="228" y="579" font-size="10" fill="#9ca3af">メモ</text>
  <text x="358" y="579" font-size="11" fill="#dc2626" text-anchor="end">個人にする</text>

  <!-- ===== card 4（未チェック） ===== -->
  <rect x="16" y="608" width="358" height="94" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="30" y="622" width="18" height="18" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="636" font-size="13" font-weight="600">無印良品</text>
  <text x="358" y="636" font-size="14" font-weight="700" text-anchor="end">¥ 2,600</text>
  <text x="58" y="654" font-size="10" fill="#6b7280">2026-08-04</text>

  <rect x="30" y="664" width="180" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="42" y="683" font-size="11" fill="#9ca3af">カテゴリ選択 ▾</text>
  <rect x="218" y="664" width="80" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="228" y="683" font-size="10" fill="#9ca3af">メモ</text>
  <text x="358" y="683" font-size="11" fill="#dc2626" text-anchor="end">個人にする</text>

  <!-- ===== sticky action bar（親指の届く位置に固定） ===== -->
  <rect x="2" y="716" width="386" height="74" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="2" y1="716" x2="388" y2="716" stroke="#d1d5db"/>
  <text x="20" y="738" font-size="11" fill="#374151">選択中 <tspan font-weight="700">2 件</tspan>（¥ 4,660）</text>
  <text x="370" y="738" font-size="10" fill="#6b7280" text-anchor="end">残り2件は未判定のまま残ります</text>
  <rect x="16" y="746" width="358" height="36" rx="8" fill="#111827"/>
  <text x="195" y="769" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">共有支出として保存</text>

  <!-- bottom tab -->
  <rect x="2" y="790" width="386" height="52" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="2" y1="790" x2="388" y2="790" stroke="#e5e7eb"/>

  <text x="80" y="812" font-size="16" text-anchor="middle">🏠</text>
  <text x="80" y="830" font-size="10" fill="#9ca3af" text-anchor="middle">ホーム</text>

  <text x="195" y="812" font-size="16" text-anchor="middle">📊</text>
  <text x="195" y="830" font-size="10" fill="#9ca3af" text-anchor="middle">清算</text>

  <text x="310" y="812" font-size="16" text-anchor="middle">📥</text>
  <text x="310" y="830" font-size="10" font-weight="600" text-anchor="middle">PayPay</text>
  <circle cx="325" cy="805" r="7" fill="#dc2626"/>
  <text x="325" y="809" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">4</text>
</svg>
