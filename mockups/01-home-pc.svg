  <text x="60" y="853" font-size="10" fill="#6b7280">この画面に「入力」「今月の状況」「一覧」を集約。旧・支出一覧画面とカテゴリ管理画面は廃止した（カテゴリ追加は入力欄の「+ 新規」から）。</text>
