<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <!-- phone frame -->
  <rect x="0" y="0" width="390" height="844" rx="28" fill="#ffffff" stroke="#111827" stroke-width="2"/>

  <!-- status bar -->
  <text x="24" y="30" font-size="11" font-weight="600">9:41</text>
  <text x="366" y="30" font-size="11" text-anchor="end">▮▮▮ ⏺</text>

  <!-- header -->
  <rect x="2" y="42" width="386" height="46" fill="#111827"/>
  <text x="20" y="71" fill="#ffffff" font-size="14" font-weight="600">家計清算</text>
  <text x="370" y="71" fill="#d1d5db" font-size="11" text-anchor="end">ありす ▾</text>

  <!-- ===== quick input (最優先。開いてすぐ入力できる) ===== -->
  <rect x="16" y="102" width="358" height="230" rx="10" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="32" y="126" font-weight="700" font-size="14">支出を記録</text>

  <!-- amount: 一番大きく、最初に触る場所 -->
  <text x="32" y="150" fill="#6b7280" font-size="11">金額</text>
  <rect x="32" y="156" width="326" height="46" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="46" y="187" font-size="24" font-weight="600" fill="#9ca3af">¥</text>

  <!-- category -->
  <text x="32" y="222" fill="#6b7280" font-size="11">カテゴリ</text>
  <rect x="32" y="228" width="230" height="34" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="44" y="250" font-size="13" fill="#9ca3af">選択 ▾</text>
  <rect x="270" y="228" width="88" height="34" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="286" y="250" font-size="12" fill="#2563eb">+ 新規</text>

  <!-- payment method: 横スクロールのチップ -->
  <text x="32" y="282" fill="#6b7280" font-size="11">支払い手段</text>
  <rect x="32" y="288" width="56" height="30" rx="15" fill="#111827"/>
  <text x="48" y="308" fill="#ffffff" font-size="11">現金</text>
  <rect x="94" y="288" width="60" height="30" rx="15" fill="#ffffff" stroke="#d1d5db"/>
  <text x="110" y="308" font-size="11">クレカ</text>
  <rect x="160" y="288" width="70" height="30" rx="15" fill="#ffffff" stroke="#d1d5db"/>
  <text x="174" y="308" font-size="11">PayPay</text>
  <rect x="236" y="288" width="86" height="30" rx="15" fill="#ffffff" stroke="#d1d5db"/>
  <text x="246" y="308" font-size="11">WeChat Pay</text>
  <text x="332" y="308" font-size="14" fill="#9ca3af">›</text>

  <!-- payer + date + submit -->
  <text x="16" y="356" fill="#6b7280" font-size="11">支払者</text>
  <rect x="62" y="344" width="62" height="28" rx="14" fill="#111827"/>
  <text x="79" y="363" fill="#ffffff" font-size="11">ありす</text>
  <rect x="130" y="344" width="62" height="28" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="147" y="363" font-size="11">ひつじ</text>

  <text x="206" y="356" fill="#6b7280" font-size="11">日付</text>
  <rect x="240" y="344" width="100" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="250" y="363" font-size="11">08-18 ▾</text>

  <!-- big submit button（親指の届く位置） -->
  <rect x="16" y="384" width="358" height="52" rx="10" fill="#111827"/>
  <text x="195" y="416" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">記録する</text>

  <!-- ===== summary（入力の下。見るのは二の次） ===== -->
  <rect x="16" y="452" width="358" height="96" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="474" fill="#6b7280" font-size="11">今月（2026-08）</text>
  <text x="32" y="504" font-size="22" font-weight="700">¥ 16,640</text>
  <text x="150" y="504" font-size="11" fill="#6b7280">6 件</text>

  <line x1="32" y1="516" x2="358" y2="516" stroke="#e5e7eb"/>
  <text x="32" y="536" font-size="12" fill="#0e7490">差額：ひつじ → ありす</text>
  <text x="358" y="536" font-size="15" font-weight="700" fill="#0e7490" text-anchor="end">¥ 2,540</text>

  <!-- ===== category chart（横棒。縦に積む） ===== -->
  <rect x="16" y="564" width="358" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="586" font-weight="600" font-size="13">カテゴリ別</text>

  <text x="32" y="608" font-size="11">食費</text>
  <rect x="90" y="597" width="180" height="14" fill="#60a5fa"/>
  <text x="358" y="608" font-size="11" text-anchor="end">¥10,720</text>

  <text x="32" y="630" font-size="11">外食</text>
  <rect x="90" y="619" width="47" height="14" fill="#f87171"/>
  <text x="358" y="630" font-size="11" text-anchor="end">¥2,800</text>

  <text x="32" y="652" font-size="11">娯楽</text>
  <rect x="90" y="641" width="30" height="14" fill="#fbbf24"/>
  <text x="358" y="652" font-size="11" text-anchor="end">¥1,800</text>

  <text x="32" y="674" font-size="11">日用品</text>
  <rect x="90" y="663" width="22" height="14" fill="#34d399"/>
  <text x="358" y="674" font-size="11" text-anchor="end">¥1,320</text>

  <text x="32" y="694" font-size="10" fill="#9ca3af">タップで内訳を開く</text>

  <!-- ===== recent expenses（一覧はここに畳む） ===== -->
  <rect x="16" y="720" width="358" height="62" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="742" font-weight="600" font-size="13">最近の支出</text>
  <text x="358" y="742" font-size="11" fill="#2563eb" text-anchor="end">すべて見る ›</text>
  <text x="32" y="764" font-size="11">08/04 食費 中華食材</text>
  <text x="358" y="764" font-size="11" text-anchor="end">¥3,540 ・ ありす</text>

  <!-- ===== bottom tab (3個) ===== -->
  <rect x="2" y="790" width="386" height="52" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="2" y1="790" x2="388" y2="790" stroke="#e5e7eb"/>

  <text x="80" y="812" font-size="16" text-anchor="middle">🏠</text>
  <text x="80" y="830" font-size="10" font-weight="600" text-anchor="middle">ホーム</text>

  <text x="195" y="812" font-size="16" text-anchor="middle">📊</text>
  <text x="195" y="830" font-size="10" fill="#9ca3af" text-anchor="middle">清算</text>

  <text x="310" y="812" font-size="16" text-anchor="middle">📥</text>
  <text x="310" y="830" font-size="10" fill="#9ca3af" text-anchor="middle">PayPay</text>
  <circle cx="325" cy="805" r="7" fill="#dc2626"/>
  <text x="325" y="809" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">4</text>
</svg>
