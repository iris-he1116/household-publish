<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="10" y="10" width="880" height="600" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>

  <!-- top nav -->
  <rect x="10" y="10" width="880" height="48" fill="#111827"/>
  <text x="30" y="40" fill="#ffffff" font-size="15" font-weight="600">家計清算アプリ</text>
  <text x="700" y="40" fill="#d1d5db" font-size="12">ありす ▾</text>

  <!-- side nav -->
  <rect x="10" y="58" width="180" height="552" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="30" y="90"  fill="#374151">  ダッシュボード</text>
  <text x="30" y="120" fill="#374151">  支出一覧</text>
  <text x="30" y="150" fill="#374151">  月次清算</text>
  <text x="30" y="180" fill="#374151">  PayPay 取り込み</text>
  <text x="30" y="210" font-weight="600">▸ カテゴリ管理</text>

  <!-- page title -->
  <text x="215" y="90" font-size="18" font-weight="700">カテゴリ管理</text>
  <text x="215" y="110" font-size="12" fill="#6b7280">並び順・名前を編集できます。使用中のカテゴリは削除できず、アーカイブに移せます。</text>

  <!-- new category form -->
  <rect x="215" y="125" width="665" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="230" y="150" font-weight="600" font-size="13">新規カテゴリを追加</text>
  <rect x="230" y="158" width="380" height="30" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="240" y="178" font-size="12" fill="#9ca3af">カテゴリ名（例: 交通費）</text>
  <rect x="625" y="158" width="90" height="30" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="640" y="178" font-size="12">🎨 色 ▾</text>
  <rect x="775" y="158" width="90" height="30" rx="6" fill="#111827"/>
  <text x="800" y="178" fill="#ffffff" font-size="12" font-weight="600">追加</text>

  <!-- toggle: show archived -->
  <text x="215" y="220" font-weight="600">利用中（5件）</text>
  <text x="740" y="220" font-size="11" fill="#2563eb">☐ アーカイブ済みを表示</text>

  <!-- table header -->
  <rect x="215" y="230" width="665" height="30" fill="#f3f4f6"/>
  <text x="230" y="250" font-size="11" fill="#6b7280">並び順</text>
  <text x="295" y="250" font-size="11" fill="#6b7280">カテゴリ名</text>
  <text x="500" y="250" font-size="11" fill="#6b7280">色</text>
  <text x="560" y="250" font-size="11" fill="#6b7280">今月の支出</text>
  <text x="680" y="250" font-size="11" fill="#6b7280">今月の件数</text>
  <text x="800" y="250" font-size="11" fill="#6b7280">操作</text>

  <!-- rows: drag handle + editable inline -->
  <g font-size="12">
    <line x1="215" y1="285" x2="880" y2="285" stroke="#e5e7eb"/>
    <text x="228" y="278" font-size="14" fill="#9ca3af">⋮⋮</text>
    <text x="253" y="278" fill="#6b7280">1</text>
    <text x="295" y="278">食費</text>
    <rect x="493" y="266" width="18" height="18" fill="#60a5fa" stroke="#3b82f6"/>
    <text x="565" y="278">¥ 52,300</text>
    <text x="695" y="278">18</text>
    <text x="800" y="278" fill="#2563eb">編集</text>
    <text x="838" y="278" fill="#6b7280">アーカイブ</text>

    <line x1="215" y1="310" x2="880" y2="310" stroke="#e5e7eb"/>
    <text x="228" y="303" font-size="14" fill="#9ca3af">⋮⋮</text>
    <text x="253" y="303" fill="#6b7280">2</text>
    <text x="295" y="303">日用品</text>
    <rect x="493" y="291" width="18" height="18" fill="#34d399" stroke="#10b981"/>
    <text x="565" y="303">¥ 28,900</text>
    <text x="695" y="303">11</text>
    <text x="800" y="303" fill="#2563eb">編集</text>
    <text x="838" y="303" fill="#6b7280">アーカイブ</text>

    <line x1="215" y1="335" x2="880" y2="335" stroke="#e5e7eb"/>
    <text x="228" y="328" font-size="14" fill="#9ca3af">⋮⋮</text>
    <text x="253" y="328" fill="#6b7280">3</text>
    <text x="295" y="328">娯楽</text>
    <rect x="493" y="316" width="18" height="18" fill="#fbbf24" stroke="#f59e0b"/>
    <text x="565" y="328">¥ 21,000</text>
    <text x="695" y="328">6</text>
    <text x="800" y="328" fill="#2563eb">編集</text>
    <text x="838" y="328" fill="#6b7280">アーカイブ</text>

    <!-- inline edit example -->
    <rect x="215" y="335" width="665" height="35" fill="#eff6ff"/>
    <line x1="215" y1="370" x2="880" y2="370" stroke="#e5e7eb"/>
    <text x="228" y="360" font-size="14" fill="#9ca3af">⋮⋮</text>
    <text x="253" y="360" fill="#6b7280">4</text>
    <rect x="290" y="345" width="180" height="24" rx="4" fill="#ffffff" stroke="#2563eb"/>
    <text x="298" y="362">外食</text>
    <rect x="493" y="348" width="18" height="18" fill="#f87171" stroke="#dc2626"/>
    <text x="565" y="360">¥ 15,600</text>
    <text x="695" y="360">7</text>
    <rect x="795" y="345" width="42" height="24" rx="4" fill="#111827"/>
    <text x="800" y="362" fill="#ffffff" font-size="11" font-weight="600">保存</text>
    <text x="843" y="360" fill="#6b7280">キャンセル</text>

    <line x1="215" y1="395" x2="880" y2="395" stroke="#e5e7eb"/>
    <text x="228" y="388" font-size="14" fill="#9ca3af">⋮⋮</text>
    <text x="253" y="388" fill="#6b7280">5</text>
    <text x="295" y="388">その他</text>
    <rect x="493" y="376" width="18" height="18" fill="#a78bfa" stroke="#8b5cf6"/>
    <text x="565" y="388">¥ 10,540</text>
    <text x="695" y="388">3</text>
    <text x="800" y="388" fill="#2563eb">編集</text>
    <text x="838" y="388" fill="#6b7280">アーカイブ</text>
  </g>

  <!-- note box -->
  <rect x="215" y="425" width="665" height="90" rx="8" fill="#fefce8" stroke="#facc15"/>
  <text x="230" y="450" font-weight="600" font-size="13">💡 アーカイブについて</text>
  <text x="230" y="475" font-size="12" fill="#713f12">
    使用中（過去に1件でも支出がある）カテゴリは**削除できません**。
  </text>
  <text x="230" y="495" font-size="12" fill="#713f12">
    「アーカイブ」を押すと新規登録の選択肢からは外れますが、過去の集計・グラフには残ります。
  </text>

  <!-- archived section preview -->
  <rect x="215" y="530" width="665" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="230" y="555" font-weight="600" font-size="13" fill="#6b7280">アーカイブ済み（0件）</text>
  <text x="230" y="580" font-size="12" fill="#9ca3af">まだアーカイブされたカテゴリはありません</text>
</svg>
